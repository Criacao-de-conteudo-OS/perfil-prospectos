<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Conectar o Instagram</title>
<style>
  :root {
    --fundo: #0f1117;
    --cartao: #1a1f2e;
    --borda: #262d40;
    --texto: #e6e8ef;
    --suave: #9aa3b8;
    --destaque: #6366f1;
    --ok: #22c55e;
    --erro: #ef4444;
  }
  @media (prefers-color-scheme: light) {
    :root { --fundo: #f4f6fb; --cartao: #ffffff; --borda: #dfe3ee; --texto: #151a27; --suave: #5b6478; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--suave); margin: 8px 0; }
  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 16px; margin-top: 20px; }
  code { display: block; font: 14px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; color: var(--texto); }
  button { margin-top: 12px; background: var(--destaque); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; cursor: pointer; }
  .ok { color: var(--ok); }
  .erro { color: var(--erro); }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Conectar o Instagram ao robô</h1>
  <p id="texto">Esta página recebe a resposta da Meta depois do login. Abra o link de login do app para começar.</p>
  <div class="cartao" id="caixa" hidden>
    <code id="codigo"></code>
    <button id="copiar" type="button">Copiar código</button>
    <p id="copiado" class="ok" hidden>Copiado.</p>
  </div>
</main>
<script>
  const parametros = new URLSearchParams(location.search);
  const codigo = parametros.get('code');
  const erro = parametros.get('error_description') || parametros.get('error_reason') || parametros.get('error');
  // Tira o código da barra de endereço e do histórico do navegador.
  if (location.search) history.replaceState(null, '', location.pathname);

  const titulo = document.getElementById('titulo');
  const texto = document.getElementById('texto');
  if (codigo) {
    titulo.textContent = 'Login feito. Falta só um passo.';
    texto.textContent = 'Copie o código abaixo e mande para o Claude no chat. Ele vale por poucos minutos e só funciona junto com a chave secreta do app, que fica no seu PC.';
    document.getElementById('codigo').textContent = codigo;
    document.getElementById('caixa').hidden = false;
    document.getElementById('copiar').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(codigo);
        document.getElementById('copiado').hidden = false;
      } catch {
        // Sem permissão de copiar: o código continua na tela para copiar à mão.
      }
    });
  } else if (erro) {
    titulo.textContent = 'O login não foi concluído.';
    titulo.className = 'erro';
    texto.textContent = 'A Meta respondeu: ' + erro + '. Tente abrir o link de login de novo.';
  }
</script>
</body>
</html>
