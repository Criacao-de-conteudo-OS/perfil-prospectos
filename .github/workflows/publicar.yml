name: Publicar no Instagram

on:
  # Só de dia: das 5h às 21h de Brasília (8h às 0h em UTC), quatro vezes por hora.
  # Os posts saem nas janelas do plano (manhã 7h-10h, almoço 12h-13h30, noite
  # 18h30-21h), então de madrugada o robô dorme. O GitHub costuma pular muitas
  # destas rodadas; por isso a rodada que acorda espera até 5h20 pelo próximo
  # post e publica na hora certa.
  schedule:
    - cron: "7,22,37,52 8-23 * * *"
  # Quando a fábrica envia posts novos.
  push:
    branches: [main]
    paths: [fila.json]
  # Botão "Run workflow" na aba Actions.
  workflow_dispatch:
    inputs:
      so_id:
        description: "Publicar agora só este post (id). Deixe vazio para seguir a agenda."
        required: false
        default: ""
      ensaio:
        description: "Ensaio: mostra o que faria, sem publicar nada"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  # Se outra rodada já está esperando o próximo post, a rodada da agenda não
  # precisa fazer nada. Assim ela termina na hora, em vez de ficar na fila
  # e ser cancelada.
  porteiro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seguir: ${{ steps.ver.outputs.seguir }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seguir=sim
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Se a consulta falhar, segue: melhor uma rodada a mais que um post perdido.
            antes=$(gh api "repos/${{ github.repository }}/actions/workflows/publicar.yml/runs?status=in_progress&per_page=30" \
              --jq '[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length' 2>/dev/null) || antes=0
            if [ "${antes:-0}" -gt 0 ] 2>/dev/null; then
              seguir=nao
              echo "Outra rodada já está cuidando da fila. Nada a fazer." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "seguir=$seguir" >> "$GITHUB_OUTPUT"

  publicar:
    needs: porteiro
    if: needs.porteiro.outputs.seguir == 'sim'
    runs-on: ubuntu-latest
    # A espera vai até 5h20; o resto dá folga para o Instagram processar o vídeo.
    timeout-minutes: 355
    concurrency:
      group: publicar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Publicar o que está na hora
        run: node robo/publicar.js
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          URL_SITE: ${{ vars.URL_SITE }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          SO_ID: ${{ inputs.so_id }}
          ENSAIO: ${{ inputs.ensaio }}
